name: App Store screenshots

# Builds the app and generates captioned App Store screenshots for the
# required iPhone (6.9") and iPad (13") sizes. Results are pushed to the
# `store-assets` branch.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/store/**'
      - 'src/**'
      - '.github/workflows/store-assets.yml'

permissions:
  contents: write

concurrency:
  group: store-assets
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Take screenshots
        run: node scripts/store/screenshots.mjs 2>&1 | tee screenshots.log
      - name: Publish to the store-assets branch
        if: always()
        run: |
          mkdir -p out/store && cp screenshots.log out/store/ 2>/dev/null || true
          cp resources/ios/AppIcon-1024.png out/store/ 2>/dev/null || true
          echo "${{ job.status }} ${{ github.sha }}" > out/store/STATUS.txt
          cd out/store
          git init -q -b store-assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "App Store screenshots for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" store-assets
